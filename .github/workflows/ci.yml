name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  resolve-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Export public dependency lock for review
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = Path("Cargo.lock").read_text()
          for i in range(0, len(data), 4000):
              print("LOCKCHUNK:" + json.dumps(data[i:i+4000]))
          PY
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run test:release
      - run: bun run check
      - run: bun run build
      - run: cargo test --workspace --exclude app-wasm
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bunx tauri build --no-bundle
