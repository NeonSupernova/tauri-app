# Template-only: checks that `cargo generate` produces a working project.
name: Template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate,wasm-pack
      - uses: Swatinem/rust-cache@v2

      - name: tauri.conf.json.liquid matches tauri.conf.json
        run: |
          mkdir -p "$RUNNER_TEMP/defaults"
          cargo generate --path . --name tauri-app --define identifier=com.example.tauri-app \
            --define "description=A Tauri + SvelteKit + Rust app" --vcs none --silent --destination "$RUNNER_TEMP/defaults"
          diff -u src-tauri/tauri.conf.json "$RUNNER_TEMP/defaults/tauri-app/src-tauri/tauri.conf.json"

      - name: Generate a project
        run: |
          cargo generate --path . --name my-test-app --define identifier=com.example.my-test-app \
            --define "description=CI test" --vcs none --silent --destination "$RUNNER_TEMP"
          if grep -rn "{{" "$RUNNER_TEMP/my-test-app" --include=*.json --include=*.html --include=*.md --include=*.toml; then
            echo "::error::Unrendered placeholders in generated project"; exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Build generated project
        working-directory: ${{ runner.temp }}/my-test-app
        run: |
          bun install --frozen-lockfile
          bun run wasm-build
          bun run check
          bun run build
          bun run test
          bunx tauri build --no-bundle
